<!doctype html>
<html lang="en">
  <head>
    <!-- jquery 사용하기 위해서 들고옴 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ajax.html</title>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div>
      <!-- <input id="userid" /> -->
      <input id="title" />
      <input id="body" />
      <button type="button" id="btnsave">등록</button>
    </div>

    <div id="result">
      <b><h1>jquery test</h1></b>
    </div>
    <script>
      //등록
      // const fruit = ["사과", "바나나", "토마토"];

      $("#btnsave").on("click", (e) => {
        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          body: JSON.stringify({
            title: $("#title").val(),
            body: $("#body").val(),
            userId: 1,
          }),
          headers: {
            "Content-type": "application/json; charset=UTF-8",
          },
        })
          //화면에 등록된 글을 추가 하기 위함
          .then((response) => response.json())
          .then((json) => {
            console.log(json);
            $("#result").prepend(`<div>${json.id}, ${json.title}</div>`);
          });
      });

      //조회
      fetch("https://jsonplaceholder.typicode.com/posts")
        .then((response) => response.json())
        .then((json) => {
          console.log(json); // id와 title값을 div에 출력

          for (i = 0; i < json.length; i++) {
            $("#result").append(
              `<div>
                <button data-id="${json[i].id}" type="button" id="btnDel"> X </button>
                ${json[i].title}</div>`,
            );
          }
        });

      //삭제 버튼 클릭 이벤트 - 부모한테 줘서 작동되도록
      $("#result").on("click", "#btnDel", (e) => {
        const id = $(e.target).data("id");
        const target = $(e.target);
        //클릭시 발생
        (fetch(`https://jsonplaceholder.typicode.com/posts/${id}`, {
          method: "DELETE",
        })
          .then((response) => response.json())
          .then((json) => {
            target.parent().remove(); //삭제 기능
          }),
          alert($(e.target).data("id"))); //알림
      });
    </script>
  </body>
</html>
